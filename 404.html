<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Resumos</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .not-found { max-width: 42rem; padding: 12vh 1.2rem; margin: 0 auto; }
        .not-found h1 { margin: .4rem 0 1rem; font-family: var(--serif); font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: .95; letter-spacing: -.05em; }
        .not-found p { color: var(--muted); }
        .not-found a { color: var(--wsf); }
    </style>
</head>
<body>
    <main class="not-found">
        <p class="eyebrow">Endereço antigo</p>
        <h1>Essa página mudou de lugar.</h1>
        <p>O acervo agora está organizado nas pastas <strong>wsf</strong>, <strong>rc</strong> e <strong>especiais</strong>.</p>
        <p><a href="index.html">Ir para o acervo completo</a></p>
    </main>

    <script>
        (() => {
            "use strict";
            const file = decodeURIComponent(location.pathname.split("/").pop() || "");
            const special = file.match(/^wsf(\d{3,4})_especial\.html$/i);
            const normal = file.match(/^wsf(\d{3,4})\.html$/i);
            let target = "";

            if (special) {
                target = `especiais/wsf${special[1].padStart(3, "0")}-especial.html`;
            } else if (normal) {
                target = `wsf/wsf${normal[1].padStart(3, "0")}.html`;
            }

            if (target) {
                location.replace(target + location.search + location.hash);
            }
        })();
    </script>
</body>
</html>
